# ---- Bright Sky via direct REST sensors (no attributes) ----
# Docs: https://brightsky.dev/docs/  (/current_weather, /weather)
# Coords ~ August-Horch-Str 3A, 80999 München

# Bright Sky REST sensors with unique_id
# Paste into your packages file or inline under `sensor:` in configuration.yaml

sensor:
  # --- current conditions (/current_weather) ---
  - platform: rest
    name: brightsky_temperature
    unique_id: brightsky_temperature_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.temperature | float(0)}}
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - platform: rest
    name: brightsky_humidity
    unique_id: brightsky_humidity_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.relative_humidity | float(0)}}
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement

  - platform: rest
    name: brightsky_pressure
    unique_id: brightsky_pressure_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.pressure_msl | float(0)}}
    unit_of_measurement: "hPa"
    device_class: pressure
    state_class: measurement

  - platform: rest
    name: brightsky_dew_point
    unique_id: brightsky_dew_point_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.dew_point | float(0)}}
    unit_of_measurement: "°C"
    state_class: measurement

  - platform: rest
    name: brightsky_cloud_cover
    unique_id: brightsky_cloud_cover_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.cloud_cover | float(0)}}
    unit_of_measurement: "%"
    state_class: measurement

  # last-hour values (use *_60 fields from /current_weather)
  - platform: rest
    name: brightsky_rain_now
    unique_id: brightsky_rain_60_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.precipitation_60 | float(0)}}
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: measurement

  - platform: rest
    name: brightsky_sunshine
    unique_id: brightsky_sunshine_60_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.sunshine_60 | float(0)}}
    unit_of_measurement: "min"
    state_class: measurement

  - platform: rest
    name: brightsky_wind_speed
    unique_id: brightsky_wind_speed_60_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.wind_speed_60 | float(0)}}
    unit_of_measurement: "m/s"
    state_class: measurement

  - platform: rest
    name: brightsky_wind_gust
    unique_id: brightsky_wind_gust_60_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{w.wind_gust_speed_60 | float(0)}}
    unit_of_measurement: "m/s"
    state_class: measurement

  - platform: rest
    name: brightsky_wind_direction
    unique_id: brightsky_wind_direction_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 300
    timeout: 20
    value_template: >
      {% set w = value_json.weather | default({}, true) %}
      {{((w.wind_direction_60 | default(None)) or (w.wind_direction_30 | default(None)) or (w.wind_direction_10 | default(0))) | float(0)}}
    unit_of_measurement: "°"

  - platform: rest
    name: brightsky_station_name
    unique_id: brightsky_station_name_now
    resource_template: >
      https://api.brightsky.dev/current_weather?lat={{state_attr('zone.home','latitude')}}&lon={{state_attr('zone.home','longitude')}}&tz=Europe/Berlin
    scan_interval: 900
    timeout: 20
    value_template: >
      {% set src = value_json.sources | default([], true) %}
      {% if src and 'station_name' in src[0] %}
        {{src[0]['station_name']}}
      {% else %}unknown{% endif %}

  # 24 h rain total ending at the current hour
  - platform: rest
    name: brightsky_rain_24h
    unique_id: brightsky_rain_24h_total
    resource_template: >-
      {{'https://api.brightsky.dev/weather'
         ~ '?lat=' ~ state_attr('zone.home','latitude')
         ~ '&lon=' ~ state_attr('zone.home','longitude')
         ~ '&date=' ~ (now().replace(minute=0, second=0, microsecond=0) - timedelta(hours=24)).isoformat()
         ~ '&last_date=' ~ now().replace(minute=0, second=0, microsecond=0).isoformat()
         ~ '&tz=Europe/Berlin'}}
    scan_interval: 600
    timeout: 20
    value_template: >-
      {% set rows = value_json.weather | default([], true) %}
      {% if not rows %}0{% else %}
        {% set now_hour = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}
        {% set window_start = now_hour - 24*3600 %}
        {% set ns = namespace(total=0.0) %}
        {% for r in rows if 'timestamp' in r %}
          {% set ts = as_timestamp(r['timestamp']) %}
          {% if ts <= now_hour and ts > window_start %}
            {% set ns.total = ns.total + (r['precipitation'] | float(0)) %}
          {% endif %}
        {% endfor %}
        {{ns.total | round(2)}}
      {% endif %}
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: total

  # 72 h rain total ending at the current hour
  - platform: rest
    name: brightsky_rain_72h
    unique_id: brightsky_rain_72h_total
    resource_template: >-
      {{'https://api.brightsky.dev/weather'
         ~ '?lat=' ~ state_attr('zone.home','latitude')
         ~ '&lon=' ~ state_attr('zone.home','longitude')
         ~ '&date=' ~ (now().replace(minute=0, second=0, microsecond=0) - timedelta(hours=72)).isoformat()
         ~ '&last_date=' ~ now().replace(minute=0, second=0, microsecond=0).isoformat()
         ~ '&tz=Europe/Berlin'}}
    scan_interval: 900
    timeout: 20
    value_template: >-
      {% set rows = value_json.weather | default([], true) %}
      {% if not rows %}0{% else %}
        {% set now_hour = as_timestamp(now().replace(minute=0, second=0, microsecond=0)) %}
        {% set window_start = now_hour - 72*3600 %}
        {% set ns = namespace(total=0.0) %}
        {% for r in rows if 'timestamp' in r %}
          {% set ts = as_timestamp(r['timestamp']) %}
          {% if ts <= now_hour and ts > window_start %}
            {% set ns.total = ns.total + (r['precipitation'] | float(0)) %}
          {% endif %}
        {% endfor %}
        {{ns.total | round(2)}}
      {% endif %}
    unit_of_measurement: "mm"
    device_class: precipitation
    state_class: total

  # Yesterday's high temperature: the max hourly temperature over the previous
  # complete calendar day (Europe/Berlin). Feeds the Event 1 `temp_high_c` field
  # (architecture.md Section 13.3.1) and the Phase 6.2 weather program logic.
  # No-data -> `unknown`; the consuming logic uses float(0), which fails safe
  # (never a spurious escalation to normal/heavy).
  - platform: rest
    name: brightsky_temp_high_yesterday
    unique_id: brightsky_temp_high_yesterday
    resource_template: >-
      {{'https://api.brightsky.dev/weather'
         ~ '?lat=' ~ state_attr('zone.home','latitude')
         ~ '&lon=' ~ state_attr('zone.home','longitude')
         ~ '&date=' ~ (now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(days=1)).isoformat()
         ~ '&last_date=' ~ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat()
         ~ '&tz=Europe/Berlin'}}
    scan_interval: 1800
    timeout: 20
    value_template: >-
      {% set rows = value_json.weather | default([], true) %}
      {% if not rows %}unknown{% else %}
        {% set yday = (now() - timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% set ns = namespace(hi=none) %}
        {% for r in rows if 'timestamp' in r and r['timestamp'][:10] == yday
           and 'temperature' in r and r['temperature'] is not none %}
          {% set t = r['temperature'] | float(-999) %}
          {% if ns.hi is none or t > ns.hi %}{% set ns.hi = t %}{% endif %}
        {% endfor %}
        {% if ns.hi is none %}unknown{% else %}{{ ns.hi | round(1) }}{% endif %}
      {% endif %}
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  # Average of the daily high temperatures over the 3 preceding COMPLETE calendar
  # days (yesterday, -2, -3; today is excluded so a partial day cannot bias the
  # morning decision). Each day's high = max hourly temp for that local date;
  # the result averages only the days that returned data. Feeds the Phase 6.2
  # weather program logic. No-data -> `unknown` (consumer float(0) fails safe).
  - platform: rest
    name: brightsky_temp_avg_high_3day
    unique_id: brightsky_temp_avg_high_3day
    resource_template: >-
      {{'https://api.brightsky.dev/weather'
         ~ '?lat=' ~ state_attr('zone.home','latitude')
         ~ '&lon=' ~ state_attr('zone.home','longitude')
         ~ '&date=' ~ (now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(days=3)).isoformat()
         ~ '&last_date=' ~ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat()
         ~ '&tz=Europe/Berlin'}}
    scan_interval: 1800
    timeout: 20
    value_template: >-
      {% set rows = value_json.weather | default([], true) %}
      {% if not rows %}unknown{% else %}
        {% set d1 = (now() - timedelta(days=1)).strftime('%Y-%m-%d') %}
        {% set d2 = (now() - timedelta(days=2)).strftime('%Y-%m-%d') %}
        {% set d3 = (now() - timedelta(days=3)).strftime('%Y-%m-%d') %}
        {% set ns = namespace(m1=none, m2=none, m3=none) %}
        {% for r in rows if 'timestamp' in r and 'temperature' in r
           and r['temperature'] is not none %}
          {% set d = r['timestamp'][:10] %}
          {% set t = r['temperature'] | float(-999) %}
          {% if d == d1 and (ns.m1 is none or t > ns.m1) %}{% set ns.m1 = t %}{% endif %}
          {% if d == d2 and (ns.m2 is none or t > ns.m2) %}{% set ns.m2 = t %}{% endif %}
          {% if d == d3 and (ns.m3 is none or t > ns.m3) %}{% set ns.m3 = t %}{% endif %}
        {% endfor %}
        {% set highs = [ns.m1, ns.m2, ns.m3] | reject('none') | list %}
        {% if highs | length == 0 %}unknown{% else %}{{ ((highs | sum) / (highs | length)) | round(1) }}{% endif %}
      {% endif %}
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

# =============================================================================
# FORECAST inputs for the Phase 7 "Next Program" card (Gate 7.2). One BrightSky
# /weather request feeds BOTH forecast sensors, via the top-level `rest:`
# platform (a single resource with child sensors) rather than two separate
# `- platform: rest` sensors. WHY: two sensors hitting the identical URL fire
# near-simultaneously at startup; BrightSky throttled the second (temp), which
# then sat `unavailable` until its next 30-min scan (observed 2026-08-22). One
# shared fetch removes the duplicate call and the race, and halves API load.
#
# Forecast day starts at 04:00 local: before 04:00 it is TODAY (the coming
# daytime, so a 02:00 glance shows the day ahead, not a premature roll); from
# 04:00 on it is TOMORROW. The per-zone program-decision templates that CONSUME
# these are deferred (see packages/watering_ui/derived_sensors.yaml) until the
# zone-interval / weather §6.2 rework; these feed the weather card until then.
# =============================================================================
rest:
  - resource_template: >-
      {% set fc = now().replace(hour=0, minute=0, second=0, microsecond=0)
                  + timedelta(days=(0 if now().hour < 4 else 1)) %}
      {{'https://api.brightsky.dev/weather'
         ~ '?lat=' ~ state_attr('zone.home','latitude')
         ~ '&lon=' ~ state_attr('zone.home','longitude')
         ~ '&date=' ~ fc.isoformat()
         ~ '&last_date=' ~ (fc + timedelta(hours=23)).isoformat()
         ~ '&tz=Europe/Berlin'}}
    scan_interval: 1800
    timeout: 20
    sensor:
      # Forecast rain total (mm). No-data -> 0 (fails safe: never predicts rain
      # that isn't forecast, so never spuriously suppresses a future watering).
      - name: brightsky_forecast_rain
        unique_id: brightsky_forecast_rain_day
        value_template: >-
          {% set rows = value_json.weather | default([], true) %}
          {% if not rows %}0{% else %}
            {% set fc = (now().replace(hour=0, minute=0, second=0, microsecond=0)
                         + timedelta(days=(0 if now().hour < 4 else 1))).strftime('%Y-%m-%d') %}
            {% set ns = namespace(total=0.0) %}
            {% for r in rows if 'timestamp' in r and r['timestamp'][:10] == fc %}
              {% set ns.total = ns.total + (r['precipitation'] | float(0)) %}
            {% endfor %}
            {{ ns.total | round(2) }}
          {% endif %}
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: total

      # Forecast high (°C) = max hourly forecast temperature on the forecast
      # date. No-data -> `unknown` (consumers use float(0), which fails safe:
      # never a spurious escalation to normal/heavy).
      - name: brightsky_forecast_temp_high
        unique_id: brightsky_forecast_temp_high_day
        value_template: >-
          {% set rows = value_json.weather | default([], true) %}
          {% if not rows %}unknown{% else %}
            {% set fc = (now().replace(hour=0, minute=0, second=0, microsecond=0)
                         + timedelta(days=(0 if now().hour < 4 else 1))).strftime('%Y-%m-%d') %}
            {% set ns = namespace(hi=none) %}
            {% for r in rows if 'timestamp' in r and r['timestamp'][:10] == fc
               and 'temperature' in r and r['temperature'] is not none %}
              {% set t = r['temperature'] | float(-999) %}
              {% if ns.hi is none or t > ns.hi %}{% set ns.hi = t %}{% endif %}
            {% endfor %}
            {% if ns.hi is none %}unknown{% else %}{{ ns.hi | round(1) }}{% endif %}
          {% endif %}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

template:
  - sensor:
      - name: brightsky_wind_speed_knots
        unique_id: brightsky_wind_speed_knots
        unit_of_measurement: "kn"
        state_class: measurement
        state: >
          {% set mps = states('sensor.brightsky_wind_speed') | float(0) %}
          {{(mps * 1.94384) | round(1)}}

      - name: brightsky_weather_url_24h
        state: >-
          {{'https://api.brightsky.dev/weather?lat=' ~ state_attr('zone.home','latitude')
             ~ '&lon=' ~ state_attr('zone.home','longitude')
             ~ '&date=' ~ (now().replace(minute=0, second=0, microsecond=0) - timedelta(hours=24)).isoformat()
             ~ '&last_date=' ~ now().replace(minute=0, second=0, microsecond=0).isoformat()
             ~ '&tz=Europe/Berlin'}}

  - binary_sensor:
      - name: brightsky_raining_now
        unique_id: brightsky_raining_now_bool
        device_class: moisture
        state: "{{states('sensor.brightsky_rain_now') | float(0) > 0.0}}"
      - name: brightsky_sunny_now
        unique_id: brightsky_sunny_now_bool
        state: "{{states('sensor.brightsky_sunshine') | float(0) >= 30}}"

# ---- Warm slow REST sensors on startup ----
# After an HA restart the long-scan_interval Bright Sky REST sensors come up
# `unavailable`/`unknown` until their first scheduled poll (temp sensors 1800 s,
# rain_72h 900 s, rain_24h 600 s). If a restart lands shortly before a watering
# window, state_window_check sees the temp sensor unavailable and takes the D-A
# fail-safe fallback (all zones `normal`) instead of running the temp tree.
# Force an immediate refresh on start so the weather decision has live data. The
# short delay lets networking + the REST platform finish coming up first.
automation:
  - id: brightsky_warm_slow_sensors_on_start
    alias: "Bright Sky - Warm slow REST sensors on start"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay:
          seconds: 30
      - service: homeassistant.update_entity
        continue_on_error: true
        data:
          entity_id:
            - sensor.brightsky_temp_avg_high_3day
            - sensor.brightsky_temp_high_yesterday
            - sensor.brightsky_rain_72h
            - sensor.brightsky_rain_24h
