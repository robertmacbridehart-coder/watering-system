# ============================================================================
# Template Sensors - Calculated Flow Rates and Pump Commands
# ============================================================================
sensor:
  - platform: template
    sensors:
      # ======================================================================
      # Zone 1 Calculated Values
      # ======================================================================
      fert_zone_1_pump1_rate_ml_per_min:
        friendly_name: "{{ states('input_text.zone_1_friendly_name') }} - Pump 1 Flow Rate"
        unit_of_measurement: "mL/min"
        icon_template: mdi:water-pump
        value_template: >
          {% set dose = states('input_number.fert_zone_1_pump1_dose_ml') | float(0) %}
          {% set runtime = states('input_number.zone_1_base_runtime_min') | float(0) %}
          {% set program = states('input_select.zone_1_program') %}
          {% set multipliers = {'off': 0.0, 'light': 0.5, 'normal': 1.0, 'heavy': 1.5} %}
          {% set actual_runtime = runtime * multipliers.get(program, 1.0) %}
          {% if actual_runtime > 0 and dose > 0 %}
            {{ (dose / actual_runtime) | round(2) }}
          {% else %}
            0
          {% endif %}

      fert_zone_1_pump1_command:
        friendly_name: "{{ states('input_text.zone_1_friendly_name') }} - Pump 1 Command"
        unit_of_measurement: "%"
        icon_template: mdi:percent
        value_template: >
          {% set required_flow = states('sensor.fert_zone_1_pump1_rate_ml_per_min') | float(0) %}
          {% set slope = states('input_number.fert_pump1_cal_slope') | float(0) %}
          {% set intercept = states('input_number.fert_pump1_cal_intercept') | float(0) %}
          {% if slope > 0 and required_flow > 0 %}
            {{ ((required_flow - intercept) / slope) | round(1) }}
          {% else %}
            0
