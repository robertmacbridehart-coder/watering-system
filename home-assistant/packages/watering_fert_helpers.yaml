###############################################################################
# Watering System - Fertigation Configuration Helpers
#
# File: home-assistant/packages/watering_fert_helpers.yaml
# Purpose: Fertigation scheduling, dosing configuration, and pump calibration
#          storage for RS-485 peristaltic dosing pumps
#
# Entity Count: 63 (36 input helpers + 27 template sensors)
#   Input Helpers (36):
#     - 1 input_number: fert_cycle_days
#     - 4 input_datetime: last_fert_zone_{1-4}
#     - 13 input_number: dosing amounts (12 zone/pump + 1 flush)
#     - 15 input_number: calibration coefficients (5 per pump × 3 pumps)
#     - 3 input_datetime: calibration dates
#     - 3 input_text: calibration notes
#   Template Sensors (27):
#     - 12 sensor: calculated flow rates (zone/pump combinations)
#     - 12 sensor: pump commands (zone/pump combinations)
#     - 3 sensor: calibration status (per pump)
#
# Pump System:
#   - 3 RS-485 peristaltic pumps (Modbus addresses 0x02-0x04)
#   - Typical use: Pump 1 = NPK, Pump 2 = Micronutrients, Pump 3 = pH adjust
#   - Dosing: Specified in mL per zone (total dose)
#   - Delivery: System calculates mL/min based on zone runtime and program
#
# Calibration:
#   - Linear model: q = a×cmd + b (flow = slope × command + intercept)
#   - Procedure: fert_pump_cal_v2.md
#   - Test pressure: 1.1 bar (PRV regulated)
#   - Acceptance: R² ≥ 0.995
#   - Recalibration: Every 90 days, after tubing change, if error >10%
#
# Current Status:
#   - RS-485 pumps NOT yet wired (Phase 1.3 blocked)
#   - All calibration helpers default to 0
#   - All dose amounts default to 0 (disabled)
#   - Template sensors will show calculated values once dependencies available
#   - Calibration status will show "EXPIRED" or "POOR" until first calibration
#
# Dependencies:
#   - input_text.zone_{1-4}_friendly_name (from watering_zone_helpers.yaml)
#   - input_number.zone_{1-4}_base_runtime_min (from watering_zone_helpers.yaml)
#   - input_select.zone_{1-4}_program (from watering_zone_helpers.yaml)
#
# Note: Soil sensor helpers (Section 4.5) deferred to Phase 3
#
# Last Updated: 2025-10-14
###############################################################################

