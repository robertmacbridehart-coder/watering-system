# ============================================================================
# State Machine Scripts - Phase 4
# ============================================================================
# Location: home-assistant/packages/watering_state/state_scripts.yaml
#
# Home of the plain-watering state machine's scripts (ADR-015):
#   Shared reporting/cleanup:
#     - finalize_cycle_record  (D3: Event 4 + clear cycle_uuid; report-only)
#     - abort_cycle_scripts    (A2: turn_off the in-flight state_* progression)
#   State transition scripts (each self-advances at its tail; A1-guarded):
#     - state_window_check      (applies compute_zone_programs -> per-zone program; S4)
#     - state_preflight_check   (tank/ESP32/control gates; mint cycle_uuid +
#                                Event 1; D-B/D-G)
#     - state_watering_plain    (R6/R7 interlock -> pump -> zones -> stop)
#     - state_post_cycle_relief (relief cycle -> R10 off -> finalize -> idle)
#
# Design references: ADR-015 (D1-D4 + D-A..D-H, A1/A2) and the Event 4 payload
# schema in architecture.md Section 13.3.1.
#
# TWO CORRECTNESS RULES for every state_* script (added in Step 4), recorded
# here for context:
#   A1  guard-the-advance: only set the next state if still in my own state.
#   -   never continue_on_error around safety-critical subscripts.
# The two scripts below are NOT state_* scripts and are exempt from A1 (they
# never advance the machine) - but they are the machinery A2 and D3 rely on.
# ============================================================================

script:
  # ==========================================================================
  # finalize_cycle_record  -  reporting-layer cleanup ONLY (ADR-015 D3)
  # ==========================================================================
  # Fires Event 4 (watering_cycle_complete) from input_text.cycle_uuid, then
  # clears the helper. This is the SOLE closer of the watering_cycles row that
  # Event 1 opened, so every cycle-ending path (normal completion, error,
  # restart-recovery, future safe-stop) calls it exactly once - see the
  # "cycle row always closes" invariant.
  #
  # HARD BOUNDARY (D3): strictly DB + cycle-sensor bookkeeping. It MUST NEVER
  #   - run pressure relief or stop/actuate any hardware, or
  #   - set input_select.watering_system_state.
  # emergency_stop / safe_shutdown keep sole ownership of hardware safing and
  # state latching; the per-error automations call THIS afterwards only to tidy
  # the report. Keeping it off the hardware/state path means a DB hiccup can
  # never stall watering or safety (architecture.md Section 13.1).
  #
  # NO-OP when no cycle is open: input_text.cycle_uuid empty (also treats
  # unknown/unavailable as "no cycle"). cycle_uuid is the state machine's own
  # source of truth for "a cycle is open"; binary_sensor.watering_cycle_active
  # is the AppDaemon-owned mirror (Event 1 -> on, Event 4 -> off) and is not
  # gated on here because no publisher exists yet (roadmap follow-up #3) and it
  # would only ever agree with cycle_uuid.
  #
  # Parameters:
  #   outcome (required): completed | aborted | error  (Event 4 controlled
  #     vocabulary; anything else is normalised to 'error' so a caller typo
  #     still produces a valid, non-rejected row).
  #   notes   (optional): free text -> Event 4 notes (empty -> NULL by writer).
  #
  # mode: single - instantaneous (no delays); a concurrent second call would
  # simply find cycle_uuid already cleared and no-op, so dropping it is safe.
  # ==========================================================================
  finalize_cycle_record:
    alias: "Finalize Cycle Record"
    icon: mdi:database-check
    mode: single
    fields:
      outcome:
        description: "Cycle outcome: completed | aborted | error"
        example: "completed"
        required: true
      notes:
        description: "Optional free-text note stored on the cycle row"
        example: "post-cycle relief complete"
        required: false
    sequence:
      - variables:
          cycle_uuid_val: "{{ states('input_text.cycle_uuid') }}"

      # No open cycle -> nothing to close. Silent no-op (this is a normal,
      # expected call from every error / restart / safe-stop path). A cycle is
      # open iff cycle_uuid carries a real minted id; test the documented 'c-'
      # uuid-format invariant (config_helpers.yaml) rather than a multi-value
      # sentinel list. The same check lives in fire_zone_run_complete
      # (zone_scripts.yaml); both key off the single 'c-' format constant.
      - if:
          - condition: template
            value_template: >-
              {{ not (cycle_uuid_val | string).startswith('c-') }}
        then:
          - stop: "No open cycle - finalize_cycle_record is a no-op"

      - variables:
          end_time: "{{ utcnow().strftime('%Y-%m-%d %H:%M:%S') }}"
          outcome_norm: >-
            {{ outcome if outcome in ['completed', 'aborted', 'error']
               else 'error' }}

      # Event 4 -> AppDaemon UPDATEs the watering_cycles row and turns
      # binary_sensor.watering_cycle_active off (architecture.md Section 13.3.1).
      # Absent optional 'notes' is sent as '' and normalised to NULL by the writer.
      - event: watering_cycle_complete
        event_data:
          cycle_uuid: "{{ cycle_uuid_val }}"
          end_time: "{{ end_time }}"
          outcome: "{{ outcome_norm }}"
          notes: "{{ notes | default('', true) }}"

      # Clear the helper AFTER firing so the uuid was still present in the event.
      # An empty cycle_uuid is the no-op signal for the next caller.
      - service: input_text.set_value
        target:
          entity_id: input_text.cycle_uuid
        data:
          value: ""

  # ==========================================================================
  # abort_cycle_scripts  -  prompt cancellation of the progression (ADR-015 A2)
  # ==========================================================================
  # script.turn_off the in-flight state_* progression scripts so a long delay
  # (chiefly the per-zone runtime waits, now held inside water_one_zone) stops
  # promptly instead of running to completion and then advancing the machine.
  # Called BEFORE safe_shutdown by the five per-error automations, restart
  # recovery, and the D-F control-state guards.
  #
  # HA script.turn_off does NOT cascade to subscripts. §2.1: rather than a
  # hand-maintained allow-list (which a newly added state_* script could
  # silently fall out of sync with), the target set is DERIVED dynamically from
  # the script registry by naming convention - every `script.state_*` - plus the
  # two non-state_ delay-bearing scripts run_zone_sequence and water_one_zone.
  # Adding a new state_* script needs no edit here.
  #
  # NEVER matches teardown/reporting scripts (their names don't start with
  # `state_`), which must not be turned off here: safe_shutdown, emergency_stop,
  # stop_main_pump, close_all_zones, close_pressure_relief, finalize_cycle_record,
  # fire_zone_run_complete, log_system_event.
  #
  # BEST-EFFORT: correctness is owned by the A1 guard-the-advance rule in each
  # state_* script, so even a missed target only leaves a harmless delay running
  # to completion (A1 stops it from clobbering the latched error state). Hence no
  # logging and no error handling - this is pure mechanical cleanup. turn_off
  # tolerates an empty list and not-yet-running / not-yet-existing targets.
  #
  # mode: single - instantaneous; a duplicate concurrent call is a harmless
  # repeat of the same turn_off set.
  # ==========================================================================
  abort_cycle_scripts:
    alias: "Abort Cycle Scripts"
    icon: mdi:cancel
    mode: single
    sequence:
      - variables:
          # All state_* progression scripts (by convention) + the two non-state_
          # delay-bearing scripts: run_zone_sequence and water_one_zone. The latter
          # holds each zone's runtime delay, so it MUST be cancellable here or an
          # aborted zone would run to completion and fire a spurious Event 3.
          progression_scripts: >-
            {{ (states.script
                | map(attribute='entity_id')
                | select('match', 'script\\.state_')
                | list) + ['script.run_zone_sequence', 'script.water_one_zone'] }}
      - service: script.turn_off
        target:
          entity_id: "{{ progression_scripts }}"

  # ==========================================================================
  # state_window_check  -  apply the shared decision -> per-zone program (S4)
  # ==========================================================================
  # Entry: dispatched when watering_system_state -> window_check (scheduler set
  # active_watering_window / active_trigger_type first).
  #
  # §3.6 S4 (ADR-021 Amendment A / ADR-018 "Option A"): this script no longer
  # decides anything itself. It calls script.compute_zone_programs -- the SAME
  # side-effect-free routine the always-on S3 recorder calls -- for the active
  # window, and APPLIES the returned programs. One decision source: what is
  # recorded in watering_weather.db is what gets applied (both calls run at the
  # window start from the same sensor states). The routine owns the weather
  # tree, the moisture guard and the UNCHANGED ADR-020 cadence/booster layer.
  #
  # Sets input_select.zone_N_program (off/light/normal/heavy/booster) for all
  # four zones, then:
  #   - all four zones 'off'  -> back to idle (nothing due / all skipped)
  #   - otherwise             -> preflight_check
  #
  # D-A (weather unavailable): handled INSIDE the routine (-> 'normal', never
  # blind 'heavy', never abort on a missing API read); this script only logs the
  # warning, keyed on the routine's weather_available flag.
  #
  # FAIL-SAFE (routine failure): if the routine is not loaded, errors, returns no
  # response, or returns anything but exactly one valid program for each of zones
  # 1-4, EVERY zone is set 'off', an error is logged, and the state returns to
  # idle (A1-guarded).
  # One window is skipped; the cadence anchor (sensor.zone_N_watering) is
  # untouched, so due zones retry at the next window.
  #
  # DELIBERATE EXCEPTION to the ADR-015 no-continue_on_error rule (header): the
  # routine call carries continue_on_error. That rule ("never continue_on_error
  # around safety-critical subscripts") protects ACTUATING subscripts whose
  # failure must reach the per-error automation. This routine actuates nothing;
  # if its failure aborted this script the machine would sit in window_check
  # forever (no stuck-state watchdog; the scheduler only starts from idle) and
  # ALL watering would stop silently. Failing to
  # 'all off -> idle' is the safe outcome. (continue_on_error does not catch
  # ServiceNotFound, hence the routine_loaded guard first; the response
  # validation also covers the empty-response case.)
  #
  # A1 (guard-the-advance): the final state change only fires if we are still in
  # window_check. Setting zone programs is always safe (config output), so only
  # the transition is guarded. A manual Dev-Tools run while parked therefore sets
  # the four programs + logs, and never advances.
  # ==========================================================================
  state_window_check:
    alias: "State: Window Check"
    icon: mdi:weather-partly-rainy
    mode: single
    sequence:
      - variables:
          window: "{{ states('input_select.active_watering_window') }}"
          routine_loaded: >-
            {{ states.script.compute_zone_programs is not none
               and states('script.compute_zone_programs') not in ['unavailable', 'unknown'] }}

      # Existence guard: continue_on_error does NOT catch ServiceNotFound (verified,
      # programming-notes "continue_on_error Scope"), so calling a routine that
      # failed to load would halt this script in window_check. Fail safe here
      # instead. (Early exit rather than wrapping the call in an if: the
      # response_variable must stay at the top level so `decision` is in scope
      # for the steps below.)
      - if:
          - condition: template
            value_template: "{{ not routine_loaded }}"
        then:
          - service: script.log_system_event
            data:
              severity: error
              event_type: state_window_check
              message: >-
                Decision routine script.compute_zone_programs is not loaded
                (window={{ window }}). Fail-safe: all zones 'off' for this window.
              logger: watering_system.state_scripts
          - repeat:
              for_each:
                - 1
                - 2
                - 3
                - 4
              sequence:
                - service: input_select.select_option
                  target:
                    entity_id: "input_select.zone_{{ repeat.item }}_program"
                  data:
                    option: "off"
          - if:
              - condition: template
                value_template: "{{ is_state('input_select.watering_system_state', 'window_check') }}"
            then:
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: idle
          - stop: "Decision routine not loaded - fail-safe all off"

      - service: script.compute_zone_programs
        continue_on_error: true
        data:
          window: "{{ window }}"
        response_variable: decision

      # Validate + extract, by zone_id (never by list position). Any defect ->
      # [] -> decision_ok false -> fail-safe all 'off'.
      - variables:
          programs: >-
            {% set valid = ['off', 'light', 'normal', 'heavy', 'booster'] %}
            {% set zd = decision.zone_decisions
                 if (decision is defined and decision is mapping
                     and decision.zone_decisions is defined)
                 else none %}
            {% set ns = namespace(r=[], ok=(zd is sequence and zd is not string
                                            and zd is not mapping and zd | length == 4)) %}
            {% if ns.ok %}
              {% for z in [1, 2, 3, 4] %}
                {% set h = namespace(n=0, p='') %}
                {% for d in zd %}
                  {% if d is mapping and (d.zone_id | int(0)) == z %}
                    {% set h.n = h.n + 1 %}
                    {% set h.p = d.computed_program | string %}
                  {% endif %}
                {% endfor %}
                {% if h.n == 1 and h.p in valid %}
                  {% set ns.r = ns.r + [h.p] %}
                {% else %}
                  {% set ns.ok = false %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.r if ns.ok else [] }}
          decision_ok: "{{ programs | length == 4 }}"
          applied: "{{ programs if decision_ok else ['off', 'off', 'off', 'off'] }}"

      - if:
          - condition: template
            value_template: "{{ not decision_ok }}"
        then:
          - service: script.log_system_event
            data:
              severity: error
              event_type: state_window_check
              message: >-
                Decision routine (compute_zone_programs, window={{ window }})
                returned no usable result. Fail-safe: all zones 'off' for this
                window; due zones retry next window.
              logger: watering_system.state_scripts
        else:
          # D-A: warn when weather is unreadable (the routine resolved 'normal').
          - if:
              - condition: template
                value_template: >-
                  {{ (decision.weather_available | string | lower) in ['false', '0'] }}
            then:
              - service: script.log_system_event
                data:
                  severity: warning
                  event_type: state_window_check
                  message: >-
                    Weather inputs unavailable (rain_24h={{ states('sensor.rain_24h') }},
                    rain_72h={{ states('sensor.rain_72h') }}). Weather tree fell back
                    to 'normal' for all zones (D-A).
                  logger: watering_system.state_scripts
          # One breadcrumb per window of what was APPLIED + why each 'off' is off
          # (the only trace of a manual cycle's decision; the S3 recorder covers
          # the scheduled windows in watering_weather.db).
          - variables:
              summary: >-
                {%- set ns = namespace(parts=[]) -%}
                {%- for z in [1, 2, 3, 4] -%}
                  {%- set c = namespace(v={}) -%}
                  {%- for d in decision.zone_decisions -%}
                    {%- if d is mapping and (d.zone_id | int(0)) == z
                           and d.decision_criteria is mapping -%}
                      {%- set c.v = d.decision_criteria -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set p = applied[z - 1] -%}
                  {%- if p == 'off' -%}
                    {%- set why = 'disabled' if c.v.get('enabled') == false
                                  else (c.v.get('skip_reason') or 'not_due') -%}
                    {%- set ns.parts = ns.parts + ['Z' ~ z ~ ' off (' ~ why ~ ')'] -%}
                  {%- else -%}
                    {%- set ns.parts = ns.parts + ['Z' ~ z ~ ' ' ~ p] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- ns.parts | join(' · ') -}}
          - service: script.log_system_event
            data:
              severity: info
              event_type: state_window_check
              message: "Programs ({{ window }}): {{ summary }}"
              logger: watering_system.state_scripts

      - repeat:
          for_each:
            - 1
            - 2
            - 3
            - 4
          sequence:
            - service: input_select.select_option
              target:
                entity_id: "input_select.zone_{{ repeat.item }}_program"
              data:
                option: "{{ applied[repeat.item | int - 1] }}"

      - variables:
          all_off: "{{ applied | reject('eq', 'off') | list | length == 0 }}"

      # A1 guard: only advance if a parallel safety/control event hasn't moved us.
      - if:
          - condition: template
            value_template: "{{ is_state('input_select.watering_system_state', 'window_check') }}"
        then:
          - if:
              - condition: template
                value_template: "{{ all_off }}"
            then:
              - service: script.log_system_event
                data:
                  severity: info
                  event_type: state_window_check
                  message: "All zones resolved to 'off' - nothing due. Returning to idle."
                  logger: watering_system.state_scripts
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: idle
            else:
              # Event 7 (§3.6 S5): hand the APPLIED decision to the AppDaemon
              # db_writer, which buffers it and writes each zone's criteria onto
              # its zone_runs row (cycle_uuid is minted in preflight, after this).
              # Fired only on the preflight path: an all-off window opens no cycle.
              # decision is validated here (decision_ok), so zone_decisions is a
              # native list; firing an event cannot fail the transition.
              - event: watering_decision_applied
                event_data:
                  window: "{{ window }}"
                  zone_decisions: "{{ decision.zone_decisions }}"
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: preflight_check

  # ==========================================================================
  # state_preflight_check  -  gate the cycle, open the DB row (Phase 4)
  # ==========================================================================
  # Entry: dispatched when watering_system_state -> preflight_check.
  #
  # Checks (fail -> set error state [unless already errored] + stop):
  #   1. Tank: plain watering gates on Low-Low (architecture.md 2.2). Sensor
  #      unavailable -> error_comms_lost (D-G); Low-Low ON -> error_tank_low.
  #   2. ESP32 online: R1 (main pump relay) availability is the proxy - all
  #      relays share the one ESP32/WiFi link. Unavailable -> error_comms_lost.
  #   3. Control booleans: manual_override_active / system_winterized OFF. If
  #      either is ON, abort quietly to idle (the D-F guard automations own
  #      engagement; the scheduler already gates, this is defence in depth).
  #
  # On pass: mint cycle_uuid (ADR-014), fire Event 1 (watering_preflight_complete),
  # advance to watering_plain (D-B: fert path deferred, so plain always).
  #
  # A1 guard wraps the mint+Event1+advance so we never open a cycle row after a
  # parallel event has taken over.
  # ==========================================================================
  state_preflight_check:
    alias: "State: Preflight Check"
    icon: mdi:clipboard-check-outline
    mode: single
    sequence:
      # §1.6: each error-set below is gated on a LIVE re-read of the state
      # (`not states(...).startswith('error_')`), NOT a one-time snapshot taken
      # at entry. At entry the state is always 'preflight_check', so a snapshot
      # would always read "not errored" and could let a later check overwrite a
      # higher-severity error_* that a concurrent handler (e.g. emergency_stop)
      # latched mid-run. Re-reading matches the A1 guard-the-advance pattern.

      # ---- Check 1: tank (Low-Low for plain) ----
      - variables:
          tank_raw: "{{ states('binary_sensor.watering_system_low_low_water_level') }}"
          tank_available: "{{ tank_raw not in ['unavailable', 'unknown'] }}"

      - if:
          - condition: template
            value_template: "{{ not tank_available }}"
        then:
          # RACE-FIX: log the breadcrumb BEFORE setting error_*. Setting an
          # error_ state triggers watering_state_on_error -> abort_cycle_scripts,
          # which turns off THIS state_* script mid-run; logging first guarantees
          # the preflight_abort reaches system_log + the watering_system_event bus
          # (and the Phase 3.5 DB row) before that self-cancel lands.
          - service: script.log_system_event
            data:
              severity: error
              event_type: preflight_abort
              message: >-
                Preflight abort: Low-Low tank sensor unavailable
                (state: {{ tank_raw }}) - treating as comms loss (D-G).
              entity_id: binary_sensor.watering_system_low_low_water_level
              value_after: "{{ tank_raw }}"
              logger: watering_system.state_scripts
          - if:
              - condition: template
                value_template: "{{ not states('input_select.watering_system_state').startswith('error_') }}"
            then:
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: error_comms_lost
          - stop: "Tank sensor unavailable - comms lost"
            error: true

      - if:
          - condition: state
            entity_id: binary_sensor.watering_system_low_low_water_level
            state: "on"
        then:
          # RACE-FIX (see Check 1): log before the error-set self-cancels us.
          - service: script.log_system_event
            data:
              severity: error
              event_type: preflight_abort
              message: "Preflight abort: tank at Low-Low - cannot start a watering cycle."
              entity_id: binary_sensor.watering_system_low_low_water_level
              value_after: "on"
              logger: watering_system.state_scripts
          - if:
              - condition: template
                value_template: "{{ not states('input_select.watering_system_state').startswith('error_') }}"
            then:
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: error_tank_low
          - stop: "Tank Low-Low - cannot water"
            error: true

      # ---- Check 2: ESP32 online (R1 availability proxy) ----
      - variables:
          pump_raw: "{{ states('switch.watering_system_relay_1_main_pump') }}"
          pump_available: "{{ pump_raw not in ['unavailable', 'unknown'] }}"

      - if:
          - condition: template
            value_template: "{{ not pump_available }}"
        then:
          # RACE-FIX (see Check 1): log before the error-set self-cancels us.
          - service: script.log_system_event
            data:
              severity: error
              event_type: preflight_abort
              message: >-
                Preflight abort: main pump relay (R1) unavailable
                (state: {{ pump_raw }}) - ESP32 offline / comms lost.
              entity_id: switch.watering_system_relay_1_main_pump
              value_after: "{{ pump_raw }}"
              logger: watering_system.state_scripts
          - if:
              - condition: template
                value_template: "{{ not states('input_select.watering_system_state').startswith('error_') }}"
            then:
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: error_comms_lost
          - stop: "ESP32 offline - comms lost"
            error: true

      # ---- Check 3: control booleans (override / winterized) ----
      # §1.5: this is a PRE-HARDWARE gate - preflight has not started the pump or
      # opened any valve yet, so returning to idle here does not "silently abort a
      # running cycle" (nothing is actuated). It therefore does NOT conflict with
      # the D-F guards' "never abort a running cycle" contract. If a control
      # boolean is flipped on at this instant, this check and the guard react to
      # the same edge with no ordering guarantee; either way the conservative
      # outcome wins (this check returns to idle without watering; the guard
      # independently reverts the boolean and notifies). Defence in depth over
      # the scheduler's start-time gate for the window between the two.
      # §3.2: capture both booleans once; the condition and the log message
      # below reuse them (nothing between can change them).
      - variables:
          override_val: "{{ states('input_boolean.manual_override_active') }}"
          winterized_val: "{{ states('input_boolean.system_winterized') }}"
      - if:
          - condition: template
            value_template: "{{ override_val == 'on' or winterized_val == 'on' }}"
        then:
          - service: script.log_system_event
            data:
              severity: warning
              event_type: preflight_abort
              message: >-
                Preflight abort: manual_override_active or system_winterized is ON
                (override={{ override_val }}, winterized={{ winterized_val }}).
                Returning to idle without watering.
              logger: watering_system.state_scripts
          - if:
              - condition: template
                value_template: "{{ is_state('input_select.watering_system_state', 'preflight_check') }}"
            then:
              - service: input_select.select_option
                target:
                  entity_id: input_select.watering_system_state
                data:
                  option: idle
          # §1.14: error: true so the caller distinguishes this halt the same
          # way as Checks 1 & 2 (the state is already back at idle; the
          # dispatcher does not branch on the result, so this only affects
          # trace/log classification).
          - stop: "Override/winterized active - not watering"
            error: true

      # ---- All checks passed: mint cycle_uuid, fire Event 1, advance ----
      - variables:
          cycle_uuid_new: "{{ 'c-' ~ utcnow().strftime('%Y%m%d%H%M%S%f') }}"
          start_time: "{{ utcnow().strftime('%Y-%m-%d %H:%M:%S') }}"
          trigger_type: "{{ states('input_select.active_trigger_type') }}"
          # §3.6 S5 (2026-09-23): the cycle row records the weather the decision
          # used (compute_zone_programs), not BrightSky's DWD-only rain and
          # YESTERDAY's high: the WH40-or-DWD selected rain, and the forecast high
          # for this window (morning -> today, evening -> tomorrow). Rows before
          # this date hold the old sources (see architecture §13 change log).
          r24: "{{ states('sensor.rain_24h') }}"
          r72: "{{ states('sensor.rain_72h') }}"
          thy: >-
            {{ states('sensor.forecast_temp_high_'
                      ~ ('today' if is_state('input_select.active_watering_window', 'morning')
                         else 'tomorrow')) }}

      # A1 guard: only open a cycle if we still own the state.
      - if:
          - condition: template
            value_template: "{{ is_state('input_select.watering_system_state', 'preflight_check') }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.cycle_uuid
            data:
              value: "{{ cycle_uuid_new }}"

          # Event 1 -> AppDaemon INSERTs watering_cycles + cycle-active on.
          # Optional numeric fields are sent as '' (=> NULL) when unreadable.
          - event: watering_preflight_complete
            event_data:
              cycle_uuid: "{{ cycle_uuid_new }}"
              start_time: "{{ start_time }}"
              trigger_type: "{{ trigger_type }}"
              rainfall_24h_mm: "{{ r24 | float(0) if is_number(r24) else '' }}"
              rainfall_72h_mm: "{{ r72 | float(0) if is_number(r72) else '' }}"
              temp_high_c: "{{ thy | float(0) if is_number(thy) else '' }}"

          - service: input_select.select_option
            target:
              entity_id: input_select.watering_system_state
            data:
              option: watering_plain

  # ==========================================================================
  # state_watering_plain  -  run the plain watering cycle (Phase 4)
  # ==========================================================================
  # Entry: dispatched when watering_system_state -> watering_plain.
  #
  # Sequence:
  #   1. Establish the plain flow path: bypass valve R6 ON, fert line R7 OFF
  #      (start_main_pump verifies the R6 XOR R7 interlock and aborts to an
  #      error state if it is wrong).
  #   2. start_main_pump (tank/relief/interlock checks + 30s stabilisation).
  #   3. run_zone_sequence(active_watering_window) - per-zone Event 3 fires
  #      inside run_zone_sequence (ADR-015 D1).
  #   4. stop_main_pump, then close_all_zones (defensive).
  #   5. advance to post_cycle_relief.
  #
  # NO continue_on_error around start_main_pump / run_zone_sequence /
  # stop_main_pump: if any sets an error_* state and stops, this script halts
  # (no advance) and the matching per-error automation runs. A1 guards the
  # advance as the second line of defence.
  # ==========================================================================
  state_watering_plain:
    alias: "State: Watering (Plain)"
    icon: mdi:sprinkler-variant
    mode: single
    sequence:
      # 1. Plain flow path: bypass open, fert line closed.
      - service: switch.turn_on
        target:
          entity_id: switch.watering_system_relay_6_fert_bypass
      - service: switch.turn_off
        target:
          entity_id: switch.watering_system_relay_7_fert_line
      # Allow the bypass (R6) and fert-line (R7) valves to PHYSICALLY open/close
      # before start_main_pump reads the R6 XOR R7 interlock. Datasheet valve
      # travel is 6-10s; 12s gives margin over the worst case.
      - delay:
          seconds: 12

      # 2. Start the main pump (self-checks; sets error_* + stops on failure).
      - service: script.start_main_pump

      # 3. Water all due zones for the active window (Event 3 fired within).
      - service: script.run_zone_sequence
        data:
          window: "{{ states('input_select.active_watering_window') }}"

      # 4. Stop pump, then belt-and-braces close all zones.
      - service: script.stop_main_pump
      - service: script.close_all_zones
      # Allow the zone valves to PHYSICALLY close before advancing to
      # post_cycle_relief (which opens the relief valve). Datasheet valve travel
      # is 6-10s; 12s gives margin over the worst case.
      - delay:
          seconds: 12

      # 5. A1 guard, then advance.
      - if:
          - condition: template
            value_template: "{{ is_state('input_select.watering_system_state', 'watering_plain') }}"
        then:
          - service: input_select.select_option
            target:
              entity_id: input_select.watering_system_state
            data:
              option: post_cycle_relief

  # ==========================================================================
  # state_post_cycle_relief  -  relieve pressure, close the cycle (Phase 4)
  # ==========================================================================
  # Entry: dispatched when watering_system_state -> post_cycle_relief.
  #
  # Built from existing subscripts (ADR-015 D3):
  #   1. close_all_zones (defensive).
  #   2. open_pressure_relief - self-contained open -> wait(bounds-checked) ->
  #      close cycle; it also stops the pump first if somehow still running.
  #   3. Disable 24V cabinet (R10) - defensive; only RS-485 devices need it, so
  #      plain watering never enabled it. Mirrors safe_shutdown: turn_off, verify
  #      with a 3s timeout, warn (do NOT error) if it fails to confirm.
  #   4. finalize_cycle_record('completed') then -> idle, both under the A1 guard
  #      so an error that supervened is finalized as 'error' by its own automation
  #      instead of being mislabelled 'completed' here.
  #
  # NO continue_on_error around close_all_zones / open_pressure_relief: a relief
  # failure sets an error_* state and stops; the per-error automation then runs
  # safe_shutdown + finalize('error'). The cycle row still closes (invariant).
  # ==========================================================================
  state_post_cycle_relief:
    alias: "State: Post-Cycle Relief"
    icon: mdi:gauge-low
    mode: single
    sequence:
      # 0. Capture cycle runtime FIRST. binary_sensor.watering_cycle_active has
      #    been ON since Event 1 (preflight complete = cycle start, db_writer.py),
      #    so its last_changed marks T0. We read it here, at the very top of
      #    post_cycle_relief, because finalize_cycle_record (step 4) fires Event 4,
      #    which AppDaemon turns into cycle_active -> OFF; reading last_changed
      #    after that would yield ~0 minutes. Resolves to none if the sensor isn't
      #    ON (e.g. AppDaemon restarted mid-cycle) - send_watering_summary then
      #    omits the runtime from the message. A script-level variables action, so
      #    summary_runtime_min stays in scope through the guarded block below.
      - variables:
          summary_runtime_min: >-
            {% set s = states.binary_sensor.watering_cycle_active %}
            {{ ((now() - s.last_changed).total_seconds() / 60) | round(0) | int
               if s is not none and s.state == 'on' else none }}

      # 1. Defensive zone close.
      - service: script.close_all_zones

      # 2. Pressure relief cycle (open -> wait -> close, self-verifying).
      - service: script.open_pressure_relief

      # 2b. Valve discipline: close BOTH fert-manifold selector valves (R6 bypass
      # + R7 fert line) so the system rests with every flow path shut - nothing
      # is left energized that isn't in use. Done AFTER the relief bleed (pressure
      # is already vented) and BEFORE cutting 24V cabinet power (R10) below, so the
      # motorized valves still have 24V to travel. watering_plain re-opens R6 at
      # the start of the next cycle and start_main_pump's R6-XOR-R7 check runs only
      # after that, so both-closed-at-rest never trips the interlock.
      - service: switch.turn_off
        target:
          entity_id:
            - switch.watering_system_relay_6_fert_bypass
            - switch.watering_system_relay_7_fert_line

      # 3. Disable 24V cabinet (R10), verify best-effort (warn only).
      - service: switch.turn_off
        target:
          entity_id: switch.watering_system_relay_10_24v_cabinet
      - wait_template: "{{ is_state('switch.watering_system_relay_10_24v_cabinet', 'off') }}"
        timeout: 3
      - if:
          - condition: template
            value_template: "{{ not is_state('switch.watering_system_relay_10_24v_cabinet', 'off') }}"
        then:
          - service: script.log_system_event
            data:
              severity: warning
              event_type: post_cycle_relief
              message: >-
                24V cabinet (R10) did not confirm OFF during post-cycle relief
                (state: {{ states('switch.watering_system_relay_10_24v_cabinet') }}).
              entity_id: switch.watering_system_relay_10_24v_cabinet
              value_after: "{{ states('switch.watering_system_relay_10_24v_cabinet') }}"
              logger: watering_system.state_scripts

      # 4. A1 guard: close the DB row 'completed' and return to idle only if we
      #    still own the state (else the supervening error's automation finalizes).
      - if:
          - condition: template
            value_template: "{{ is_state('input_select.watering_system_state', 'post_cycle_relief') }}"
        then:
          # continue_on_error so a DB/finalize hiccup can never strand the machine
          # in post_cycle_relief: the idle transition below MUST still run. This
          # matches watering_state_on_error and watering_state_restart_recovery,
          # which also wrap finalize in continue_on_error. finalize is report-only
          # (D3: no hardware, no state), so ignoring its failure here is safe; the
          # restart-recovery backstop still closes any row finalize missed.
          - service: script.finalize_cycle_record
            continue_on_error: true
            data:
              outcome: completed
              notes: "post-cycle relief complete"
          # 9.10: end-of-cycle Watering Summary (STANDARD tier - WhatsApp-only,
          # winter-gated inside send_standard_notification). continue_on_error so
          # a notify hiccup can NEVER strand the machine in post_cycle_relief: the
          # idle transition below MUST still run (same rationale as finalize
          # above). Placed AFTER finalize so it reflects the closed cycle; runtime
          # was captured at step 0, before Event 4 flipped cycle_active OFF.
          - service: script.send_watering_summary
            continue_on_error: true
            data:
              runtime_min: "{{ summary_runtime_min }}"
          - service: input_select.select_option
            target:
              entity_id: input_select.watering_system_state
            data:
              option: idle
