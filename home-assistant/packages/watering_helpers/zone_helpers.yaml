###############################################################################
# Watering System - Per-Zone Configuration Helpers
#
# File: home-assistant/packages/watering_zone_helpers.yaml
# Purpose: Per-zone settings for weather-based watering program selection
#          and runtime calculations
#
# Entity Count: 96 helpers (24 per zone × 4 zones)
#   - 4 input_text (friendly names for dynamic naming)
#   - 8 input_select (4 season + 4 program)
#   - 84 input_number (4 base runtime + 80 seasonal thresholds)
#
# Zone Assignments:
#   - Zone 1: Raspberries (berry canes, moderate water needs)
#   - Zone 2: Blueberries (shallow roots, higher water needs)
#   - Zone 3: TBD (placeholder for future crop)
#   - Zone 4: TBD (placeholder for future crop)
#
# Friendly Naming Strategy:
#   - Base name stored in input_text.zone_{id}_friendly_name
#   - All other helpers use Jinja templates to reference base name
#   - Allows changing zone assignment without editing 70+ friendly names
#
# Weather Evaluation Logic (window_check state):
#   if rain_72h > rain_off_mm: program = off
#   elif rain_24h > rain_light_mm: program = light
#   elif temp_avg_3day > temp_heavy_c AND rain_72h < rain_min_mm: program = heavy
#   elif temp_avg_3day > temp_normal_c: program = normal
#   else: program = light
#
# Last Updated: 2025-10-14
###############################################################################

# ============================================================================
# Friendly Name Helpers
# ============================================================================
input_text:
  zone_1_friendly_name:
    name: "Zone 1 Friendly Name"
    initial: "Raspberries"
    icon: mdi:fruit-cherries
    max: 30

  zone_2_friendly_name:
    name: "Zone 2 Friendly Name"
    initial: "Blueberries"
    icon: mdi:fruit-cherries
    max: 30

  zone_3_friendly_name:
    name: "Zone 3 Friendly Name"
    initial: "Zone 3"
    icon: mdi:sprout
    max: 30

  zone_4_friendly_name:
    name: "Zone 4 Friendly Name"
    initial: "Zone 4"
    icon: mdi:sprout
    max: 30

# ============================================================================
# Zone Season and Program Selection
# ============================================================================
input_select:
  # --- Season Selectors ---
  zone_1_season:
    name: "{{states('input_text.zone_1_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    initial: spring

  zone_2_season:
    name: "{{states('input_text.zone_2_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    initial: spring

  zone_3_season:
    name: "{{states('input_text.zone_3_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    initial: spring

  zone_4_season:
    name: "{{states('input_text.zone_4_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    initial: spring

  # --- Program Overrides ---
  zone_1_program:
    name: "{{states('input_text.zone_1_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
    initial: normal

  zone_2_program:
    name: "{{states('input_text.zone_2_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
    initial: normal

  zone_3_program:
    name: "{{states('input_text.zone_3_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
    initial: normal

  zone_4_program:
    name: "{{states('input_text.zone_4_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
    initial: normal

