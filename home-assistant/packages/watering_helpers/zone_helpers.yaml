    icon: mdi:timer
    min: 1
    max: 120
    step: 1
    initial: 30
    unit_of_measurement: "min"
    mode: box

  # --- Per-Zone Watering Interval (cadence gate) ---
  # N = "water on the Nth day": the zone runs a MAIN dose once every N days,
  # measured from its last main dose (sensor.zone_N_watering, which excludes the
  # heavy mid-interval booster). Consumed by compute_zone_programs; replaces the
  # retired system-wide input_number.watering_cycle_days (ADR-015 D-C closed).
  # A heavy program adds a 0.5x booster at the interval midpoint (N/2 days).
  #
  # NO initial: - RestoreEntity so an operator's per-crop cadence survives a
  # restart (ADR-017; same class as zone_N_season). First boot with no stored
  # state falls back to `min` = 1 day, but that is moot on a fresh system because
  # zone_N_enabled comes up OFF (no watering until the zone is enabled).
  zone_1_watering_interval_days:
    name: "{{states('input_text.zone_1_friendly_name')}} - Watering Interval"
    icon: mdi:calendar-clock
    min: 1
    max: 14
    step: 1
    unit_of_measurement: "days"
    mode: box

  zone_2_watering_interval_days:
    name: "{{states('input_text.zone_2_friendly_name')}} - Watering Interval"
    icon: mdi:calendar-clock
    min: 1
    max: 14
    step: 1
    unit_of_measurement: "days"
    mode: box

