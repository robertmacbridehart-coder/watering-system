###############################################################################
# Watering System - Per-Zone Configuration Helpers
#
# File: home-assistant/packages/watering_helpers/zone_helpers.yaml
# Purpose: Per-zone settings for weather-based watering program selection
#          and runtime calculations
#
# Entity Count: 124 helpers
#   - 4 input_text (friendly names)
#   - 8 input_boolean (4 allow_full_dose_light_program + 4 zone_enabled, per zone)
#   - 8 input_select (4 season + 4 program)
#   - 104 input_number (4 base runtime + 4 watering interval + 80 seasonal weather
#                       thresholds + 16 fert 14d targets)
#
# 2026-09-23 (ADR-021 Amendment A, S2-rework):
#   - The 48 seasonal soil-moisture ladder helpers
#     (zone_N_{season}_{off,light,normal}_moisture_min) were REMOVED. Moisture is
#     now a guard, not a ladder; its per-zone helpers live in
#     packages/watering_state/moisture_guard.yaml.
#   - The 80 weather thresholds dropped `initial:` -> RestoreEntity (ADR-017), so
#     operator tuning survives a restart. HA restores the last stored value.
#
# Zone Assignments:
#   - Zone 1: Raspberries (berry canes, moderate water needs)
#   - Zone 2: Blueberries (shallow roots, higher water needs)
#   - Zone 3: TBD (placeholder for future crop)
#   - Zone 4: TBD (placeholder for future crop)
#
# Friendly Naming Strategy:
#   - Base name stored in input_text.zone_{id}_friendly_name
#   - All other helpers use Jinja templates to reference base name
#   - Allows changing zone assignment without editing 70+ friendly names
#
# Weather Evaluation Logic: architecture.md §3.2 is canonical.
#   - script.compute_zone_programs decides (ADR-021 Amendment A): weather-primary
#     tree (current-rain skip, window-aware de-lagged forecast high, capped
#     forecast downgrade) + a moisture guard (dry bump, wet veto) + the ADR-020
#     cadence layer. state_window_check APPLIES it (§3.6 S4); the S3 recorder
#     records it every window.
#
# Last Updated: 2026-09-23
###############################################################################

# ============================================================================
# Friendly Name Helpers
# ============================================================================
input_text:
  zone_1_friendly_name:
    name: "Zone 1 Friendly Name"
    initial: "Raspberries"
    icon: mdi:fruit-cherries
    max: 30

  zone_2_friendly_name:
    name: "Zone 2 Friendly Name"
    initial: "Blueberries"
    icon: mdi:fruit-cherries
    max: 30

  zone_3_friendly_name:
    name: "Zone 3 Friendly Name"
    initial: "Zone 3"
    icon: mdi:sprout
    max: 30

  zone_4_friendly_name:
    name: "Zone 4 Friendly Name"
    initial: "Zone 4"
    icon: mdi:sprout
    max: 30

# ============================================================================
# Fertigation Light Program Behavior Control
# ============================================================================
# Purpose: Control whether zone receives full or proportional fertilizer dose
#          during light watering programs (50% runtime)
#
# Logic:
#   IF zone_program == "light" AND boolean == ON:
#     dose_multiplier = 1.0  (Full dose: 100% fert in 50% water = 2x concentration)
#   IF zone_program == "light" AND boolean == OFF:
#     dose_multiplier = 0.5  (Proportional: 50% fert in 50% water = same concentration)
#
# Safety: Defaults to OFF (conservative proportional dosing)
#         Only enable for salt-tolerant crops (raspberries, vegetables)
#         Keep OFF for salt-sensitive crops (blueberries, azaleas, rhododendrons)
#
# Warning: Enabling this setting doubles fertilizer concentration during light programs
#          Inappropriate for ericaceous (acid-loving) plants
# ============================================================================

input_boolean:
  zone_1_allow_full_dose_light_program:
    name: "{{states('input_text.zone_1_friendly_name')}} - Allow Full Dose in Light Program"
    icon: mdi:beaker-alert
    initial: false

  zone_2_allow_full_dose_light_program:
    name: "{{states('input_text.zone_2_friendly_name')}} - Allow Full Dose in Light Program"
    icon: mdi:beaker-alert
    initial: false  # Blueberries/lingonberries are salt-sensitive

  zone_3_allow_full_dose_light_program:
    name: "{{states('input_text.zone_3_friendly_name')}} - Allow Full Dose in Light Program"
    icon: mdi:beaker-alert
    initial: false

  zone_4_allow_full_dose_light_program:
    name: "{{states('input_text.zone_4_friendly_name')}} - Allow Full Dose in Light Program"
    icon: mdi:beaker-alert
    initial: false

  # ==========================================================================
  # Per-Zone Master Enable (hard on/off)
  # ==========================================================================
  # ON  = zone participates in cycles normally.
  # OFF = zone is removed from EVERY cycle - the decision routine forces its
  #       program to 'off', which zeroes both watering runtime AND the fert
  #       dose multiplier. This is a durable operator override: unlike selecting
  #       'off' in zone_N_program (which the weather tree overwrites every
  #       window), this boolean is honoured on every evaluation until turned
  #       back on.
  #
  # NO initial: - RestoreEntity so an operator's disable survives an HA restart
  # (ADR-017 no-`initial:` rule). First boot with no stored state falls back to
  # OFF = disabled = no water, the fail-safe / opt-in direction shared with the
  # enable_*_window booleans. NOTE: at go-live each zone must be explicitly
  # enabled once (they come up OFF on the first boot after this helper is added).
  # ==========================================================================
  zone_1_enabled:
    name: "{{states('input_text.zone_1_friendly_name')}} - Zone Enabled"
    icon: mdi:power

  zone_2_enabled:
    name: "{{states('input_text.zone_2_friendly_name')}} - Zone Enabled"
    icon: mdi:power

  zone_3_enabled:
    name: "{{states('input_text.zone_3_friendly_name')}} - Zone Enabled"
    icon: mdi:power

  zone_4_enabled:
    name: "{{states('input_text.zone_4_friendly_name')}} - Zone Enabled"
    icon: mdi:power

# ============================================================================
# Zone Season and Program Selection
# ============================================================================
input_select:
  # --- Season Selectors ---
  zone_1_season:
    name: "{{states('input_text.zone_1_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    # NO initial: - RestoreEntity so the operator's season selection survives a
    # restart instead of snapping back to spring (spring in mid-August applied the
    # wrong seasonal thresholds - found 2026-08-18). Nothing auto-sets season, so
    # an initial: made it silently revert on every restart. First boot with no
    # stored state falls back to options[0] = spring. See ADR-017 + the
    # zone_sequencing_mode note.

  zone_2_season:
    name: "{{states('input_text.zone_2_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    # NO initial: - RestoreEntity, same as zone_1_season (2026-08-18).

  zone_3_season:
    name: "{{states('input_text.zone_3_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    # NO initial: - RestoreEntity, same as zone_1_season (2026-08-18).

  zone_4_season:
    name: "{{states('input_text.zone_4_friendly_name')}} - Current Season"
    icon: mdi:calendar-range
    options:
      - spring
      - summer
      - fall
      - winter
    # NO initial: - RestoreEntity, same as zone_1_season (2026-08-18).

  # --- Program Overrides ---
  # 'booster' is the mid-interval heavy top-up (0.5x base runtime) placed by
  # the decision routine at the interval midpoint - it is a SYSTEM-set value, not
  # an operator selection, but must be a listed option so window_check can set
  # it. calculate_zone_runtime maps it to 0.5x; at the DB boundary
  # (fire_zone_run_complete) it is recorded as weather_program='heavy' with
  # program_multiplier=0.5 so the schema's CHECK vocabulary is unchanged.
  zone_1_program:
    name: "{{states('input_text.zone_1_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
      - booster
    initial: normal

  zone_2_program:
    name: "{{states('input_text.zone_2_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
      - booster
    initial: normal

  zone_3_program:
    name: "{{states('input_text.zone_3_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
      - booster
    initial: normal

  zone_4_program:
    name: "{{states('input_text.zone_4_friendly_name')}} - Watering Program"
    icon: mdi:water
    options:
      - "off"
      - light
      - normal
      - heavy
      - booster
    initial: normal

