       WHERE zone_id = 2 AND aborted = 0 AND end_time IS NOT NULL
         AND weather_program = 'heavy' AND COALESCE(program_multiplier, 1.0) = 0.5
       ORDER BY start_time DESC
       LIMIT 1;
    column: "last_booster"
    value_template: >-
      {% if value in [none, ''] %}unknown
      {% else %}{{ as_datetime(value ~ '+00:00').isoformat() }}{% endif %}
    device_class: timestamp

  - name: "Zone 3 Last Booster"
    unique_id: zone_3_last_booster
    db_url: "sqlite:////config/watering_ops.db"
    query: >-
      SELECT start_time AS last_booster
        FROM zone_runs
       WHERE zone_id = 3 AND aborted = 0 AND end_time IS NOT NULL
         AND weather_program = 'heavy' AND COALESCE(program_multiplier, 1.0) = 0.5
       ORDER BY start_time DESC
       LIMIT 1;
    column: "last_booster"
    value_template: >-
      {% if value in [none, ''] %}unknown
      {% else %}{{ as_datetime(value ~ '+00:00').isoformat() }}{% endif %}
    device_class: timestamp

  - name: "Zone 4 Last Booster"
    unique_id: zone_4_last_booster
    db_url: "sqlite:////config/watering_ops.db"
    query: >-
      SELECT start_time AS last_booster
        FROM zone_runs
       WHERE zone_id = 4 AND aborted = 0 AND end_time IS NOT NULL
         AND weather_program = 'heavy' AND COALESCE(program_multiplier, 1.0) = 0.5
       ORDER BY start_time DESC
       LIMIT 1;
    column: "last_booster"
    value_template: >-
      {% if value in [none, ''] %}unknown
      {% else %}{{ as_datetime(value ~ '+00:00').isoformat() }}{% endif %}
    device_class: timestamp

# -----------------------------------------------------------------------------
# Per-zone fertigation next-due (item 4). Pure interval math on existing
# helpers -- last_fert_zone_{n} (date-only input_datetime; `timestamp` attr is
# local-midnight epoch) + fert_cycle_days. Buildable now even though dosing
# hardware is unwired: this predicts the NEXT due date; it does not require any
# dose to have been delivered.
#
# `availability` hides the sensor until a real last-fert date is set: an unset
# input_datetime restores to the 1970 epoch, so anything before 2000-01-01
# (946684800) is treated as "never fertilized" -> unavailable (no misleading
# 1970+7d due date). device_class timestamp; as_datetime(<epoch>) yields a
# UTC-aware instant. Day-granularity, so within-interval DST shift is immaterial.
# -----------------------------------------------------------------------------
template:
  - sensor:
      - name: "Zone 1 Fert Next Due"
        unique_id: zone_1_fert_next_due
        device_class: timestamp
        availability: >-
          {{ state_attr('input_datetime.last_fert_zone_1', 'timestamp') is not none
             and (state_attr('input_datetime.last_fert_zone_1', 'timestamp') | int(0)) >= 946684800 }}
        state: >-
          {% set ts = state_attr('input_datetime.last_fert_zone_1', 'timestamp') | int(0) %}
          {% set days = states('input_number.fert_cycle_days') | int(7) %}
          {{ as_datetime(ts + days * 86400).isoformat() }}

      - name: "Zone 2 Fert Next Due"
        unique_id: zone_2_fert_next_due
        device_class: timestamp
        availability: >-
          {{ state_attr('input_datetime.last_fert_zone_2', 'timestamp') is not none
             and (state_attr('input_datetime.last_fert_zone_2', 'timestamp') | int(0)) >= 946684800 }}
        state: >-
          {% set ts = state_attr('input_datetime.last_fert_zone_2', 'timestamp') | int(0) %}
          {% set days = states('input_number.fert_cycle_days') | int(7) %}
          {{ as_datetime(ts + days * 86400).isoformat() }}

      - name: "Zone 3 Fert Next Due"
        unique_id: zone_3_fert_next_due
        device_class: timestamp
        availability: >-
          {{ state_attr('input_datetime.last_fert_zone_3', 'timestamp') is not none
             and (state_attr('input_datetime.last_fert_zone_3', 'timestamp') | int(0)) >= 946684800 }}
        state: >-
          {% set ts = state_attr('input_datetime.last_fert_zone_3', 'timestamp') | int(0) %}
          {% set days = states('input_number.fert_cycle_days') | int(7) %}
          {{ as_datetime(ts + days * 86400).isoformat() }}

      - name: "Zone 4 Fert Next Due"
        unique_id: zone_4_fert_next_due
        device_class: timestamp
        availability: >-
          {{ state_attr('input_datetime.last_fert_zone_4', 'timestamp') is not none
             and (state_attr('input_datetime.last_fert_zone_4', 'timestamp') | int(0)) >= 946684800 }}
        state: >-
          {% set ts = state_attr('input_datetime.last_fert_zone_4', 'timestamp') | int(0) %}
          {% set days = states('input_number.fert_cycle_days') | int(7) %}
          {{ as_datetime(ts + days * 86400).isoformat() }}
