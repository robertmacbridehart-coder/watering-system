###############################################################################
# Watering System - System-Level Configuration Helpers
#
# File: home-assistant/packages/watering_config_helpers.yaml
# Purpose: UI-configurable parameters for state machine control, scheduling,
#          and safety limits
#
# Entity Count: 12 helpers
#   - 2 input_select (state machine, sequencing mode)
#   - 3 input_number (cycle days, max runtime, pressure relief duration)
#   - 4 input_datetime (morning/evening window start/end - time only)
#   - 3 input_boolean (morning/evening enable, manual override)
#
# Note: input_select.season moved to per-zone helpers (see watering_zone_helpers.yaml)
# Note: input_boolean.system_winterized exists in watering_notification_helpers.yaml
#       (Phase 9 - Notification System)
#
# Last Updated: 2025-10-14
# Architecture Reference: architecture.md v1.2.2 Section 4.1
###############################################################################

input_select:
  watering_system_state:
    name: "Watering System State"
    icon: mdi:state-machine
    options:
      - idle
      - window_check
      - preflight_check
      - watering_plain
      - fert_prep
      - fert_dose_phase1
      - fert_dose_phase2
      - post_cycle_relief
      - error_tank_low
      - error_comms_lost
      - manual_override
    initial: idle

  zone_sequencing_mode:
    name: "Zone Sequencing Mode"
    icon: mdi:valve
    options:
      - parallel
      - sequential
    initial: parallel

input_number:
  watering_cycle_days:
    name: "Watering Cycle Interval"
    icon: mdi:calendar-clock
    min: 1
    max: 14
    step: 1
    initial: 3
    unit_of_measurement: "days"
    mode: box

  max_single_zone_runtime_min:
    name: "Maximum Single Zone Runtime"
    icon: mdi:timer-alert
    min: 1
    max: 180
    step: 1
    initial: 120
    unit_of_measurement: "minutes"
    mode: box

  pressure_relief_duration_sec:
    name: "Pressure Relief Valve Duration"
    icon: mdi:valve
    min: 5
    max: 300
    step: 10
    initial: 120
    unit_of_measurement: "seconds"
    mode: box

input_datetime:
  morning_window_start:
    name: "Morning Window Start"
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true

  morning_window_end:
    name: "Morning Window End"
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true

  evening_window_start:
    name: "Evening Window Start"
    icon: mdi:weather-sunset-down
    has_date: false
    has_time: true

  evening_window_end:
    name: "Evening Window End"
    icon: mdi:weather-sunset-down
    has_date: false
    has_time: true

input_boolean:
  enable_morning_window:
    name: "Enable Morning Watering Window"
    icon: mdi:weather-sunset-up
    initial: true

  enable_evening_window:
    name: "Enable Evening Watering Window"
    icon: mdi:weather-sunset-down
    initial: true

  manual_override_active:
    name: "Manual Override Mode"
    icon: mdi:hand-back-right
    initial: false
