# ============================================================================
# ESPHome Secrets Template
# ============================================================================
# INSTRUCTIONS:
# 1. Copy this file to: /config/esphome/secrets.yaml
# 2. Replace all placeholder values with your actual credentials
# 3. Never commit secrets.yaml to git (it's in .gitignore)
# 4. Keep this template file in /config/esphome/archive/ folder
# ============================================================================

# -------------------- WiFi Credentials --------------------
wifi_ssid: !secret wifi_ssid
wifi_password: !secret wifi_password
wifi_ap_password: "YOUR_FALLBACK_AP_PASSWORD"

# -------------------- ESPHome API & OTA --------------------
# Generate API key with: esphome run watering-system.yaml (first time)
# Or manually generate 32-byte base64 key
esphome_api_key: !secret esphome_api_key

# OTA password for over-the-air updates (use a strong password)
esphome_ota_password: !secret esphome_ota_password

# -------------------- Victron SmartSolar MPPT --------------------
# MAC address format: "AA:BB:CC:DD:EE:FF"
# Find MAC: Use VictronConnect app or BLE scanner
victron_smartsolar_mac: "AA:BB:CC:DD:EE:FF"

# Bindkey format: 32-character hexadecimal string
# Get bindkey: VictronConnect app -> Device -> Settings -> Instant readout via Bluetooth
victron_smartsolar_bindkey: !secret victron_smartsolar_bindkey

# ============================================================================
# NOTES:
# - All values above MUST be replaced with your actual credentials
# - API key is auto-generated on first flash if left blank
# - Victron bindkey is case-insensitive hex (32 chars = 16 bytes)
# - Keep secrets.yaml secure and never share publicly
# ============================================================================
