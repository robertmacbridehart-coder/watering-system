      - script.execute: turn_off_relay_16_safe

  # -------------------- Individual Safe Relay Control Scripts --------------------
  # Relay 1
  - id: turn_on_relay_1_safe
    mode: single
    then:
      - script.execute: v24_ensure_on
      - delay: 50ms
      - switch.turn_on: relay_1_raw
      - script.execute: v24_off_delay

  - id: turn_off_relay_1_safe
    mode: single
