# -------------------- UART + Modbus Settings --------------------
uart:
  id: modbus_uart
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 512

modbus:
  id: modbus1
  uart_id: modbus_uart
  send_wait_time: 8ms

# -------------------- Modbus Relay Board (RAW coils) --------------------
# NOTE: These raw switches are NOT exposed to HA. The template wrappers below are.
modbus_controller:
  - id: relay_board
    address: 0x01
    modbus_id: modbus1
    command_throttle: 100ms

switch:
  # -------------------- RAW Modbus Coils (Internal Only) --------------------
  # Relays 1-9, 11-16: Standard relay coils
  - platform: modbus_controller
    modbus_controller_id: relay_board
    id: relay_1_raw
    register_type: coil
    address: 0
    internal: true
    restore_mode: ALWAYS_OFF

