# -------------------- 24V State Mirror --------------------
binary_sensor:
  - platform: template
    id: v24_active
    internal: true
    lambda: |-
      return id(relay_10).state;

# -------------------- Helper Scripts --------------------
script:
  # Ensure 24V is ON before any Modbus frame
  - id: v24_ensure_on
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_off: v24_active
          then:
            - switch.turn_on: relay_10
            - delay: 300ms

  # Turn 24V off a short time after the last command
  - id: v24_off_delay
    mode: restart
    then:
      - delay: 60s
      - switch.turn_off: relay_10

  # -------------------- ON Sequence Scripts (with 120min auto-off) --------------------
  # Relay 1
  - id: relay_1_on_sequence
    mode: restart
    then:
      - script.execute: turn_on_relay_1_safe
      - delay: 120min
      - script.execute: turn_off_relay_1_safe

  # Relay 2
  - id: relay_2_on_sequence
    mode: restart
    then:
      - script.execute: turn_on_relay_2_safe
